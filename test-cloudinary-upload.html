<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudinary Upload Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 2px dashed #667eea;
            border-radius: 5px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .log {
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            border-radius: 5px;
            display: none;
        }

        .result img {
            max-width: 100%;
            margin-top: 10px;
            border-radius: 5px;
        }

        .error {
            background: #ffebee;
            border-left-color: #f44336;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🌤️ Cloudinary Upload Test</h1>

        <div class="form-group">
            <label>Select an Image or Video:</label>
            <input type="file" id="fileInput" accept="image/*,video/*">
        </div>

        <button id="uploadBtn" disabled>Upload to Cloudinary</button>

        <div class="progress" id="progress">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>

        <div class="log" id="log">Console logs will appear here...</div>

        <div class="result" id="result"></div>
    </div>

    <script>
        const CLOUD_NAME = 'dghffr4t1';
        const UPLOAD_PRESET = 'school_uploads'; // Updated to match your existing preset

        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const progress = document.getElementById('progress');
        const progressBar = document.getElementById('progressBar');
        const logDiv = document.getElementById('log');
        const resultDiv = document.getElementById('result');

        let selectedFile = null;

        function log(message, isError = false) {
            const timestamp = new Date().toLocaleTimeString();
            const logMessage = `[${timestamp}] ${message}\n`;
            logDiv.textContent += logMessage;
            logDiv.scrollTop = logDiv.scrollHeight;

            if (isError) {
                console.error(message);
            } else {
                console.log(message);
            }
        }

        fileInput.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                uploadBtn.disabled = false;
                log(`📁 File selected: ${selectedFile.name} (${(selectedFile.size / 1024 / 1024).toFixed(2)} MB)`);
                log(`📋 File type: ${selectedFile.type}`);
                resultDiv.style.display = 'none';
            }
        });

        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            logDiv.textContent = '';
            log('🚀 Starting upload...');
            log(`☁️ Cloud Name: ${CLOUD_NAME}`);
            log(`⚙️ Upload Preset: ${UPLOAD_PRESET}`);

            uploadBtn.disabled = true;
            progress.style.display = 'block';
            resultDiv.style.display = 'none';

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('upload_preset', UPLOAD_PRESET);
            formData.append('folder', 'school_management_uploads');

            // Determine resource type
            let resourceType = "auto";
            if (selectedFile.type.startsWith("image/")) {
                resourceType = "image";
            } else if (selectedFile.type.startsWith("video/")) {
                resourceType = "video";
            }

            log(`🎯 Resource type: ${resourceType}`);

            const uploadUrl = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`;
            log(`🌐 Upload URL: ${uploadUrl}`);

            const xhr = new XMLHttpRequest();

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded * 100) / e.total);
                    progressBar.style.width = percent + '%';
                    progressBar.textContent = percent + '%';
                }
            };

            xhr.onload = () => {
                log(`📥 Response status: ${xhr.status}`);

                if (xhr.status === 200) {
                    const response = JSON.parse(xhr.responseText);
                    log(`✅ Upload successful!`);
                    log(`🔗 URL: ${response.secure_url}`);
                    log(`🆔 Public ID: ${response.public_id}`);

                    resultDiv.className = 'result';
                    resultDiv.innerHTML = `
                        <strong>✅ Upload Successful!</strong><br>
                        <strong>URL:</strong> <a href="${response.secure_url}" target="_blank">${response.secure_url}</a><br>
                        <strong>Public ID:</strong> ${response.public_id}<br>
                        <strong>Format:</strong> ${response.format}<br>
                        <strong>Resource Type:</strong> ${response.resource_type}
                        ${resourceType === 'image' ? `<img src="${response.secure_url}" alt="Uploaded image">` : ''}
                    `;
                    resultDiv.style.display = 'block';
                } else {
                    log(`❌ Upload failed with status ${xhr.status}`, true);
                    log(`Response: ${xhr.responseText}`, true);

                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <strong>❌ Upload Failed</strong><br>
                        <strong>Status:</strong> ${xhr.status}<br>
                        <strong>Response:</strong> ${xhr.responseText}
                    `;
                    resultDiv.style.display = 'block';
                }

                uploadBtn.disabled = false;
                progress.style.display = 'none';
                progressBar.style.width = '0%';
            };

            xhr.onerror = () => {
                log('❌ Network error during upload', true);
                uploadBtn.disabled = false;
                progress.style.display = 'none';

                resultDiv.className = 'result error';
                resultDiv.innerHTML = '<strong>❌ Network Error</strong><br>Check your internet connection.';
                resultDiv.style.display = 'block';
            };

            xhr.open('POST', uploadUrl);
            xhr.send(formData);
        });
    </script>
</body>

</html>
