version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: school_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mern_network

  backend:
    build: ./backend
    container_name: school_backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=4000
      - DB_URL=mongodb://mongo:27017/school_db
    depends_on:
      - mongo
    networks:
      - mern_network

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:4000
    container_name: school_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - mern_network

networks:
  mern_network:
    driver: bridge

volumes:
  mongo_data:
