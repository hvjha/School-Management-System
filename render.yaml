services:
  # Backend Service
  - type: web
    name: school-system-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 4000
      - key: MONGO_URI
        sync: false # Paste your mongodb+srv connection string in the Render dashboard
      - key: JWT_SECERET
        value: '#Manish#Project#Team'
      - key: CLOUDINARY_CLOUD_NAME
        value: dghffr4t1
      - key: CLOUDINARY_API_KEY
        value: 537171639812781
      - key: CLOUDINARY_API_SECRET
        sync: false # Paste your Cloudinary API Secret in the Render dashboard
      - key: RAZORPAY_KEY_ID
        value: rzp_test_your_key_id # Replace or keep as sync: false if you prefer
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false # Paste your Razorpay Key Secret in the Render dashboard
      - key: FRONTEND_URL
        fromService:
          type: web
          name: school-system-frontend
          property: host

  # Frontend Service
  - type: web
    name: school-system-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: school-system-backend
          property: url