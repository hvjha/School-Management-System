services:
  # Backend Service
  - type: web
    name: school-system-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 4000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECERET
        value: '#Manish#Project#Team'
      - key: CLOUDINARY_CLOUD_NAME
        value: dghffr4t1
      - key: CLOUDINARY_API_KEY
        value: 537171639812781
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://school-system-frontend-qbw5.onrender.com

  # Frontend Service
  - type: web
    name: school-system-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    dockerBuildArgs:
      VITE_API_URL: https://school-system-backend-qbw5.onrender.com
    envVars:
      - key: VITE_API_URL
        value: https://school-system-backend-qbw5.onrender.com